name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # ubuntu-latest no longer ships the 3.9 toolchain; 3.9 runs on windows only
        python: ["3.9", "3.11", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check dirtidy tests

      - name: Run tests
        run: pytest -v
