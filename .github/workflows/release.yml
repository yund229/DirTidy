name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install -e .[dev] pyinstaller

      - name: Run tests before packaging
        run: pytest -v

      - name: Build portable exe
        run: >
          pyinstaller --onefile --console --name DirTidy
          dirtidy/__main__.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DirTidy.exe
          generate_release_notes: true
